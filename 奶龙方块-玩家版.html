<html lang="zh-CN" data-eusoft-scrollable-element="1"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141919">
  <title>奶龙方块</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2f2e9;
      --muted: #aab2a8;
      --panel: #202725;
      --panel-light: #29322e;
      --line: #414a43;
      --lime: #c1ed6b;
      --coral: #ff8067;
      --board-width: min(68vw, 360px, 46vh);
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      background: #141919;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      background:
        radial-gradient(ellipse at 82% 8%, #344138 0, transparent 31rem),
        radial-gradient(ellipse at 8% 95%, #26332c 0, transparent 27rem),
        #141919;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(100% - 36px, 940px); margin: auto; padding: 26px 0 30px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; grid-template-columns: repeat(2, 9px); gap: 3px; transform: rotate(-8deg); }
    .brand-mark i { width: 9px; height: 9px; background: var(--lime); }
    .brand-mark i:nth-child(2), .brand-mark i:nth-child(3) { background: var(--coral); }
    .brand-name { font-size: 14px; font-weight: 800; letter-spacing: .08em; }
    .eyebrow { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .top-actions { display: flex; gap: 8px; }
    .icon-button, .utility-button, .control-button {
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); background: var(--panel); cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .icon-button { width: 42px; height: 42px; border-radius: 8px; }
    .icon-button:hover, .utility-button:hover { border-color: var(--lime); background: var(--panel-light); }
    button:active { transform: scale(.96); }
    button:focus-visible, input:focus-visible + label { outline: 2px solid var(--lime); outline-offset: 3px; }
    svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .layout { display: grid; grid-template-columns: 1fr minmax(190px, 236px); gap: 24px; align-items: start; }
    .game-column { min-width: 0; }
    .game-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 13px; }
    h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(25px, 4vw, 36px); font-weight: 500; letter-spacing: .015em; }
    .game-heading p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .status { color: var(--lime); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .board-frame { position: relative; width: var(--board-width); margin: auto; padding: 7px; border: 1px solid #4b554a; border-radius: 9px; background: #101514; box-shadow: 0 22px 60px #0005; }
    #board { display: block; width: 100%; height: auto; border-radius: 3px; touch-action: none; }
    .board-overlay { position: absolute; inset: 7px; display: none; place-items: center; border-radius: 3px; background: #111817d9; text-align: center; }
    .board-overlay.visible { display: grid; }
    .overlay-title { font: 26px Georgia, serif; }
    .overlay-copy { margin-top: 8px; color: var(--muted); font-size: 12px; }
    .side-column { display: grid; min-width: 0; gap: 12px; padding-top: 49px; }
    .panel { min-width: 0; padding: 15px; border: 1px solid #39423d; border-radius: 8px; background: #202725df; }
    .panel-label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .score-value { margin-top: 7px; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 13px; }
    .stat-value { margin-top: 5px; font-size: 20px; font-variant-numeric: tabular-nums; }
    .next-wrap { display: flex; justify-content: center; min-height: 108px; align-items: center; }
    #next { width: 132px; height: 102px; }
    .texture-preview { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 11px; }
    .texture-thumb { width: 45px; height: 36px; overflow: hidden; border: 1px solid #556153; border-radius: 4px; background: #141919; flex: 0 0 auto; }
    .texture-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .texture-copy { min-width: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .texture-copy strong { display: block; overflow: hidden; color: var(--ink); font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .piece-picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin-top: 10px; }
    .piece-select { position: relative; display: grid; place-items: center; aspect-ratio: 1; min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: #18201d; color: var(--muted); cursor: pointer; font-weight: 700; }
    .piece-select[aria-pressed="true"] { border-color: var(--lime); background: #2d382a; color: var(--lime); }
    .piece-select.has-image::after { position: absolute; right: 3px; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); content: ""; }
    .piece-selection { margin-top: 10px; }
    .piece-selection .texture-preview { margin-top: 0; }
    .edition-badge { padding: 5px 8px; border: 1px solid #657749; border-radius: 5px; color: var(--lime); font-size: 10px; font-weight: 700; letter-spacing: .06em; }
    .utility-button { width: 100%; min-height: 40px; gap: 8px; padding: 0 12px; border-radius: 6px; font-size: 12px; }
    .utility-button svg { width: 16px; height: 16px; }
    .upload-input { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
    .hint { margin: 10px 0 0; color: #89938b; font-size: 10px; line-height: 1.5; }
    .mobile-controls { display: none; }
    .footer-note { display: flex; justify-content: space-between; margin-top: 14px; color: #98a198; font-size: 10px; }
    kbd { padding: 2px 5px; border: 1px solid #465048; border-radius: 3px; background: #202725; font: inherit; color: var(--ink); }

    @media (min-width: 720px) {
      :root { --board-width: min(42vw, 390px, 68vh); }
      .shell { padding-top: 34px; }
      .layout { grid-template-columns: minmax(340px, 1fr) 236px; gap: 42px; }
      .game-heading { max-width: 430px; margin-right: auto; margin-left: auto; }
      .board-frame { max-width: 390px; }
    }
    @media (max-width: 719px) {
      :root { --board-width: min(100%, 300px, 42vh); }
      .shell { width: min(100% - 28px, 520px); padding-top: max(17px, env(safe-area-inset-top)); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
      .topbar { margin-bottom: 15px; }
      .layout { grid-template-columns: minmax(0, 1fr) minmax(112px, 136px); gap: 12px; }
      .game-heading { display: block; min-height: 53px; }
      h1 { font-size: 25px; }
      .game-heading p { font-size: 10px; }
      .status { display: block; margin-top: 6px; font-size: 9px; }
      .side-column { gap: 8px; padding-top: 48px; }
      .panel { padding: 11px; }
      .score-value { font-size: 24px; }
      .stats-row { gap: 5px; margin-top: 12px; }
      .panel-label { font-size: 8px; }
      .stat-value { font-size: 17px; }
      .next-wrap { min-height: 79px; }
      #next { width: 100px; height: 77px; }
      .texture-preview { gap: 7px; }
      .texture-thumb { width: 36px; height: 30px; }
      .texture-copy { font-size: 9px; }
      .texture-copy strong { font-size: 10px; }
      .utility-button { min-height: 37px; padding: 0 7px; font-size: 10px; }
      .hint, .footer-note { display: none; }
      .mobile-controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; width: min(100%, 430px); margin: 13px auto 0; touch-action: manipulation; }
      .control-button { min-width: 0; width: 100%; padding: 0; height: 48px; border-radius: 7px; background: #27302c; }
      .control-button svg { width: 21px; height: 21px; }
      .control-button.drop { color: #182015; border-color: var(--lime); background: var(--lime); }
    }
    @media (max-height: 700px) and (max-width: 719px) {
      :root { --board-width: min(100%, 270px, 38vh); }
      .shell { padding-top: 10px; }
      .topbar { margin-bottom: 9px; }
      .mobile-controls { margin-top: 8px; }
      .control-button { height: 42px; }
    }
  </style>

        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停" title="暂停 / 继续">

        </button>

        </button>
      </div>

          <span class="status" id="statusText">正在生成玩家版</span>
        </div>
        <div class="board-frame">

<script>
    (() => {
      "use strict";

      const COLS = 10;
      const ROWS = 20;
      const SHAPES = {
        I: [[1, 1, 1, 1]],
        O: [[1, 1], [1, 1]],
        T: [[0, 1, 0], [1, 1, 1]],
        S: [[0, 1, 1], [1, 1, 0]],
        Z: [[1, 1, 0], [0, 1, 1]],
        J: [[1, 0, 0], [1, 1, 1]],
        L: [[0, 0, 1], [1, 1, 1]]
      };
      const COLORS = { I: "#55d6c2", O: "#f4cc62", T: "#bd91ef", S: "#9dd769", Z: "#ff8067", J: "#72a9ef", L: "#f29a59" };
      const boardCanvas = document.querySelector("#board");
      const ctx = boardCanvas.getContext("2d");
      const nextCanvas = document.querySelector("#next");
      const nextCtx = nextCanvas.getContext("2d");
      const $ = (selector) => document.querySelector(selector);
      let board;
      let active;
      let nextType;
      let bag = [];
      let score = 0;
      let cleared = 0;
      let level = 1;
      let paused = false;
      let over = false;
      const PIECE_NAMES = { I: "长条", O: "正方形", T: "T 形", S: "S 形", Z: "Z 形", J: "J 形", L: "L 形" };
      const RELEASE_PACKAGE = window.TETRIS_RELEASE_PACKAGE || null;
      const isPlayerVersion = Boolean(RELEASE_PACKAGE);
      const textures = Object.fromEntries(Object.keys(SHAPES).map((type) => [type, null]));
      let assetsReady = !isPlayerVersion;
      let selectedPiece = "I";
      let pendingImageLoads = 0;
      let lastTime = 0;
      let fallTime = 0;
      let animationId;
      let touchStart = null;

      function refillBag() {
        bag = Object.keys(SHAPES);
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [bag[i], bag[j]] = [bag[j], bag[i]];
        }
      }

      function randomType() {
        if (!bag.length) refillBag();
        return bag.pop();
      }

      function spawn() {
        const type = nextType || randomType();
        nextType = randomType();
        const matrix = SHAPES[type].map((row) => row.slice());
        active = { type, matrix, x: Math.floor((COLS - matrix[0].length) / 2), y: 0 };
        drawNext();
        if (collides(active.matrix, active.x, active.y)) endGame();
      }

      function collides(matrix, x, y) {
        return matrix.some((row, dy) => row.some((cell, dx) => {
          if (!cell) return false;
          const bx = x + dx;
          const by = y + dy;
          return bx < 0 || bx >= COLS || by >= ROWS || (by >= 0 && board[by][bx]);
        }));
      }

      function move(dx, dy) {
        if (!assetsReady || paused || over || !active) return false;
        if (collides(active.matrix, active.x + dx, active.y + dy)) return false;
        active.x += dx;
        active.y += dy;
        if (dy > 0) score += dy;
        updateStats();
        return true;
      }

      function rotate() {
        if (!assetsReady || paused || over || !active) return;
        const rotated = active.matrix[0].map((_, index) => active.matrix.map((row) => row[index]).reverse());
        for (const offset of [0, -1, 1, -2, 2]) {
          if (!collides(rotated, active.x + offset, active.y)) {
            active.matrix = rotated;
            active.x += offset;
            return;
          }
        }
      }

      function lockPiece() {
        active.matrix.forEach((row, dy) => row.forEach((cell, dx) => {
          if (cell && active.y + dy >= 0) {
            board[active.y + dy][active.x + dx] = {
              type: active.type,
              texture: textures[active.type],
              pieceX: dx,
              pieceY: dy,
              pieceWidth: active.matrix[0].length,
              pieceHeight: active.matrix.length
            };
          }
        }));
        const remaining = board.filter((row) => row.some((cell) => !cell));
        const count = ROWS - remaining.length;
        if (count) {
          board = Array.from({ length: count }, () => Array(COLS).fill(0)).concat(remaining);
          cleared += count;
          score += [0, 100, 300, 500, 800][count] * level;
          level = Math.floor(cleared / 10) + 1;
          updateStats();
        }
        spawn();
      }

      function hardDrop() {
        if (!assetsReady || paused || over || !active) return;
        let distance = 0;
        while (!collides(active.matrix, active.x, active.y + 1)) {
          active.y++;
          distance++;
        }
        score += distance * 2;
        updateStats();
        lockPiece();
      }

      function updateStats() {
        $("#score").textContent = score.toLocaleString();
        $("#lines").textContent = cleared;
        $("#level").textContent = level;
      }

      function endGame() {
        over = true;
        $("#overlayTitle").textContent = "游戏结束";
        $("#overlayCopy").textContent = "点击重新开始，再来一局";
        $("#overlay").classList.add("visible");
        $("#statusText").textContent = "本局结束";
      }

      function togglePause() {
        if (!assetsReady || over) return;
        paused = !paused;
        $("#overlayTitle").textContent = "已暂停";
        $("#overlayCopy").textContent = "点击暂停按钮继续";
        $("#overlay").classList.toggle("visible", paused);
        $("#statusText").textContent = paused ? "已暂停" : "进行中";
        $("#pauseButton").setAttribute("aria-label", paused ? "继续" : "暂停");
      }

      function reset() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0;
        cleared = 0;
        level = 1;
        bag = [];
        paused = !assetsReady;
        over = false;
        fallTime = 0;
        $("#overlayTitle").textContent = "正在加载图片";
        $("#overlayCopy").textContent = "请稍候，马上开始";
        $("#overlay").classList.toggle("visible", paused);
        $("#statusText").textContent = paused ? "正在加载图片" : "进行中";
        $("#pauseButton").setAttribute("aria-label", "暂停");
        updateStats();
        nextType = randomType();
        spawn();
        render();
      }

      function imageCrop(texture, columns, rows) {
        if (!texture) return null;
        const targetRatio = columns / rows;
        const imageRatio = texture.image.naturalWidth / texture.image.naturalHeight;
        if (imageRatio > targetRatio) {
          const width = texture.image.naturalHeight * targetRatio;
          return { sx: (texture.image.naturalWidth - width) / 2, sy: 0, sw: width, sh: texture.image.naturalHeight };
        }
        const height = texture.image.naturalWidth / targetRatio;
        return { sx: 0, sy: (texture.image.naturalHeight - height) / 2, sw: texture.image.naturalWidth, sh: height };
      }

      function optimizeTextureImage(image) {
        const maxDimension = 768;
        const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (!blob) return reject(new Error("图片压缩失败"));
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error || new Error("图片读取失败"));
            reader.readAsDataURL(blob);
          }, "image/webp", 0.82);
        });
      }

      function drawBlock(context, x, y, size, type, texture, pieceX, pieceY, pieceWidth, pieceHeight) {
        const inset = texture ? 0 : Math.max(1, size * 0.035);
        context.save();
        context.beginPath();
        context.rect(x + inset, y + inset, size - inset * 2, size - inset * 2);
        context.clip();
        if (texture) {
          const crop = imageCrop(texture, pieceWidth, pieceHeight);
          const originX = x - pieceX * size;
          const originY = y - pieceY * size;
          context.drawImage(texture.image, crop.sx, crop.sy, crop.sw, crop.sh, originX, originY, pieceWidth * size, pieceHeight * size);
        } else {
          context.fillStyle = COLORS[type];
          context.fillRect(x + inset, y + inset, size - inset * 2, size - inset * 2);
          context.fillStyle = "#ffffff20";
          context.fillRect(x + inset, y + inset, size - inset * 2, Math.max(2, size * 0.11));
        }
        if (!texture) {
          context.strokeStyle = "#10151455";
          context.lineWidth = Math.max(1, size * 0.025);
          context.strokeRect(x + inset, y + inset, size - inset * 2, size - inset * 2);
        }
        context.restore();
      }

      function render() {
        const width = boardCanvas.width;
        const height = boardCanvas.height;
        const cell = width / COLS;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#171e1b";
        ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = "#ffffff0c";
        ctx.lineWidth = 1;
        for (let x = 1; x < COLS; x++) {
          ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, height); ctx.stroke();
        }
        for (let y = 1; y < ROWS; y++) {
          ctx.beginPath(); ctx.moveTo(0, y * cell); ctx.lineTo(width, y * cell); ctx.stroke();
        }
        board.forEach((row, y) => row.forEach((pieceCell, x) => {
          if (pieceCell) {
            drawBlock(ctx, x * cell, y * cell, cell, pieceCell.type, pieceCell.texture, pieceCell.pieceX, pieceCell.pieceY, pieceCell.pieceWidth, pieceCell.pieceHeight);
          }
        }));
        if (active && !over) {
          let ghostY = active.y;
          while (!collides(active.matrix, active.x, ghostY + 1)) ghostY++;
          active.matrix.forEach((row, dy) => row.forEach((filled, dx) => {
            if (!filled) return;
            if (ghostY !== active.y) {
              ctx.strokeStyle = "#e4eadb66";
              ctx.lineWidth = 2;
              ctx.strokeRect((active.x + dx) * cell + 3, (ghostY + dy) * cell + 3, cell - 6, cell - 6);

            drawBlock(ctx, (active.x + dx) * cell, (active.y + dy) * cell, cell, active.type, textures[active.type], dx, dy, active.matrix[0].length, active.matrix.length);
          }));
        }
      }

      function drawNext() {
        const width = nextCanvas.width;
        const height = nextCanvas.height;
        nextCtx.clearRect(0, 0, width, height);
        if (!nextType) return;
        const matrix = SHAPES[nextType];
        const cell = Math.min(25, (width - 12) / matrix[0].length, (height - 8) / matrix.length);
        const left = (width - matrix[0].length * cell) / 2;
        const top = (height - matrix.length * cell) / 2;
        matrix.forEach((row, y) => row.forEach((filled, x) => {
          if (filled) drawBlock(nextCtx, left + x * cell, top + y * cell, cell, nextType, textures[nextType], x, y, matrix[0].length, matrix.length);
        }));
      }

      function updateTexturePanel() {
        const texture = textures[selectedPiece];
        $("#textureName").textContent = `${selectedPiece} · ${PIECE_NAMES[selectedPiece]}`;
        $("#textureSub").textContent = texture ? texture.name : "尚未设置图片";
        $("#textureThumb").innerHTML = "";
        if (texture) {
          const thumb = new Image();
          thumb.src = texture.url;
          $("#textureThumb").append(thumb);
        }
        $("#clearImage").style.display = texture ? "inline-flex" : "none";
        document.querySelectorAll("[data-piece]").forEach((button) => {
          const selected = button.dataset.piece === selectedPiece;
          button.setAttribute("aria-pressed", String(selected));
          button.classList.toggle("has-image", Boolean(textures[button.dataset.piece]));
        });
      }

      async function publishPlayerVersion() {
        const packagedTextures = {};
        for (const [type, texture] of Object.entries(textures)) {
          if (!texture) continue;
          if (!texture.source) throw new Error(`${type} 方块图片尚未准备好`);
          packagedTextures[type] = { source: texture.source, name: texture.name };
        }

        const packageData = JSON.stringify({ version: 1, textures: packagedTextures }).replace(/</g, "\\u003c");
        let html = document.documentElement.outerHTML;
        const scriptIndex = html.indexOf("<script>");
        if (scriptIndex < 0) throw new Error("找不到游戏脚本");
        html = `${html.slice(0, scriptIndex)}<script>window.TETRIS_RELEASE_PACKAGE=${packageData};<\/script>\n${html.slice(scriptIndex)}`;

        const downloadUrl = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = `${document.title.replace(/[\\/:*?"<>|]/g, "-")}-玩家版.html`;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      }

      async function loadPlayerVersion() {
        if (!isPlayerVersion) return;
        $("#texturePanel").hidden = true;
        $("#editionBadge").hidden = false;
        $("#statusText").textContent = "策划者版本";
        const entries = Object.entries(RELEASE_PACKAGE.textures || {});
        const results = await Promise.all(entries.map(([type, record]) => new Promise((resolve) => {
          if (!SHAPES[type] || !record || !record.source) return resolve(false);
          const image = new Image();
          image.onload = () => {
            textures[type] = { image, url: record.source, name: record.name || `${type}.png` };
            resolve(true);
          };
          image.onerror = () => resolve(false);
          image.src = record.source;
        })));
        if (results.some((loaded) => !loaded)) {
          $("#overlayTitle").textContent = "图片加载失败";
          $("#overlayCopy").textContent = "请重新生成玩家版";
          $("#overlay").classList.add("visible");
          $("#statusText").textContent = "图片加载失败";
          return;
        }
        assetsReady = true;
        paused = false;
        $("#overlay").classList.remove("visible");
        $("#statusText").textContent = "进行中";
        drawNext();
        render();
      }

      function frame(time = 0) {
        const delta = Math.min(time - lastTime, 100);
        lastTime = time;
        if (!paused && !over) {
          fallTime += delta;
          const interval = Math.max(80, 850 - (level - 1) * 65);
          if (fallTime >= interval) {
            fallTime = 0;
            if (!move(0, 1)) lockPiece();
          }
          render();
        }
        animationId = requestAnimationFrame(frame);
      }

      function action(name) {
        if (name === "left") move(-1, 0);
        if (name === "right") move(1, 0);
        if (name === "down") {
          if (!move(0, 1) && !paused && !over) lockPiece();
        }
        if (name === "rotate") rotate();
        if (name === "drop") hardDrop();
        render();
      }

      document.addEventListener("keydown", (event) => {
        const actions = { ArrowLeft: "left", ArrowRight: "right", ArrowDown: "down", ArrowUp: "rotate", " ": "drop" };
        if (event.key.toLowerCase() === "p" || event.key === "Escape") {
          event.preventDefault();
          togglePause();
        } else if (actions[event.key]) {
          event.preventDefault();
          action(actions[event.key]);
        }
      });
      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          action(button.dataset.action);
        });
      });
      boardCanvas.addEventListener("pointerdown", (event) => {
        touchStart = { x: event.clientX, y: event.clientY, time: Date.now() };
        boardCanvas.setPointerCapture(event.pointerId);
      });
      boardCanvas.addEventListener("pointerup", (event) => {
        if (!touchStart) return;
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 16) rotate();
        else if (Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? -1 : 1, 0);
        else if (dy > 55 && Date.now() - touchStart.time < 260) hardDrop();
        else if (dy > 0) move(0, 1);
        else rotate();
        touchStart = null;
        render();
      });
      boardCanvas.addEventListener("pointercancel", () => { touchStart = null; });
      $("#pauseButton").addEventListener("click", togglePause);
      $("#restartButton").addEventListener("click", reset);
      document.querySelectorAll("[data-piece]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedPiece = button.dataset.piece;
          updateTexturePanel();
        });
      });
      $("#chooseImage").addEventListener("click", () => $("#imageInput").click());
      $("#imageInput").addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file || !file.type.startsWith("image/")) return;
        const pieceType = selectedPiece;
        const url = URL.createObjectURL(file);
        const selectedImage = new Image();
        pendingImageLoads++;
        $("#publishButton").disabled = true;
        let pendingLoadFinished = false;
        const finishPendingLoad = () => {
          if (pendingLoadFinished) return;
          pendingLoadFinished = true;
          pendingImageLoads--;
          $("#publishButton").disabled = pendingImageLoads > 0;
        };
        const finishSelection = (image, source) => {
          if (textures[pieceType] && textures[pieceType].url.startsWith("blob:")) URL.revokeObjectURL(textures[pieceType].url);
          URL.revokeObjectURL(url);
          textures[pieceType] = { image, url: source, source, name: file.name };
          updateTexturePanel();
          drawNext();
          render();
          finishPendingLoad();
        };
        const failSelection = () => {
          URL.revokeObjectURL(url);
          finishPendingLoad();
          $("#statusText").textContent = "图片压缩失败，请重试";
        };
        selectedImage.onload = async () => {
          try {
            const source = await optimizeTextureImage(selectedImage);
            const optimizedImage = new Image();
            optimizedImage.onload = () => finishSelection(optimizedImage, source);
            optimizedImage.onerror = failSelection;
            optimizedImage.src = source;
          } catch (error) {
            console.error(error);
            failSelection();
          }
        };
        selectedImage.onerror = failSelection;
        selectedImage.src = url;
        event.target.value = "";
      });
      $("#publishButton").addEventListener("click", async () => {
        const button = $("#publishButton");
        button.disabled = true;
        $("#statusText").textContent = "正在生成玩家版";
        try {
          await publishPlayerVersion();
          $("#statusText").textContent = "玩家版已下载";
        } catch (error) {
          console.error(error);
          $("#statusText").textContent = "发布失败，请重试";
        } finally {
          button.disabled = pendingImageLoads > 0;
        }
      });
      $("#clearImage").addEventListener("click", () => {
        if (textures[selectedPiece] && textures[selectedPiece].url.startsWith("blob:")) URL.revokeObjectURL(textures[selectedPiece].url);
        textures[selectedPiece] = null;
        updateTexturePanel();
        drawNext();
        render();
      });

      reset();
      updateTexturePanel();
      loadPlayerVersion();
      animationId = requestAnimationFrame(frame);
      window.addEventListener("pagehide", () => {
        cancelAnimationFrame(animationId);
        Object.values(textures).forEach((texture) => {
          if (texture && texture.url.startsWith("blob:")) URL.revokeObjectURL(texture.url);
        });
      });
    })();
